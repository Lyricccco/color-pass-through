<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="210" viewBox="0 0 1400 210" role="img" aria-labelledby="title desc">
  <title id="title">Color Pass-Through training and inference flowchart</title>
  <desc id="desc">Two training branches merge at inference and continue from left to right through one-step observer calibration to color pass-through.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="5.2" refY="3" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L6 3L0 6Z" fill="#000000"/>
    </marker>
    <style>
      .text {
        fill: #000000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 18px;
      }
      .stage { font-weight: 600; }
      .note {
        fill: #000000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
      }
      .line {
        fill: none;
        stroke: #000000;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .arrow { marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="210" fill="#ffffff"/>

  <text class="text" x="20" y="49">Prepared camera/display pairs</text>
  <path class="line arrow" d="M286 43H331"/>
  <text class="text stage" x="346" y="49">Projector training</text>

  <text class="text" x="20" y="175">HSI + simulated camera RGB</text>
  <path class="line arrow" d="M286 169H331"/>
  <text class="text stage" x="346" y="175">Camera-null training</text>

  <path class="line" d="M520 43H570L635 104"/>
  <path class="line" d="M520 169H570L635 108"/>
  <path class="line arrow" d="M635 106H680"/>

  <text class="text stage" x="695" y="112">Inference</text>
  <path class="line arrow" d="M781 106H831"/>

  <text class="text stage" x="846" y="101">One-step observer calibration</text>
  <text class="note" x="846" y="127">(once per observer)</text>
  <path class="line arrow" d="M1110 106H1160"/>

  <text class="text stage" x="1175" y="112">Color pass-through</text>
</svg>
