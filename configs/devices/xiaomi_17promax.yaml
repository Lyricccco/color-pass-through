schema_version: 1
device_id: xiaomi_17promax
camera_model: Xiaomi 17 Pro Max

data:
  capture_root: dataset://projector/xiaomi_17promax/raw
  projector:
    pairs: dataset://projector/xiaomi_17promax/derived/v1/Image_Pairs_Flow
    frame_shape: [472, 864]
    train_split: dataset://splits/projector_train_800.txt
    test_split: dataset://splits/projector_test_100.txt
    hald_split: dataset://splits/projector_hald_1.txt
  camera_null:
    spectrum: dataset://camera_null/hyperspectral_gt/v1
    camera_rgb: dataset://camera_null/simulated_rgb/v1/xiaomi_17promax
    validation_split: dataset://splits/hsi_val_182.txt
  colorchecker: dataset://camera_null/colorchecker/xiaomi_17promax

raw:
  base_exposure: 0.216
  demosaic: AHD
  white_balance_mode: analog_balance_to_unity
  crop_top_bottom: 384
  resize_scale: 0.25
  crop_multiple: 64
  gain_map: dataset://projector/xiaomi_17promax/calibration/vignetting_fitted/gain_gainmaps.npz
  gain_key: gain_center1
  apply_gain_map: false
  dark_frame_raw: dataset://projector/xiaomi_17promax/calibration/dark_frame_fitted/Fit_flat-frame.npy
  dark_frame_rgb: dataset://projector/xiaomi_17promax/calibration/dark_frame_fitted/Fit_flat-frame.png
  pair_roi:
    raw: {center_x: 2040, center_y: 1526, height: 1012}
    isp: {center_x: 2040, center_y: 1142, height: 1012}

models:
  projector:
    input_mode: raw_green_context
    encoding: fourier
    num_frequencies: 4
    hidden_dim: 128
    hidden_layers: 2
    output_activation: none
    checkpoint: repo://checkpoints/xiaomi_projector.ckpt
  camera_null:
    camera_sensitivity: dataset://camera_null/fitted/xiaomi_17promax/estimated_css.npy
    pca_components: dataset://camera_null/fitted/xiaomi_17promax/pca_components_n3.npy
    num_components: 1
    coefficient_weight: 1.0
    tv_weight: 0.01
    spectrum_weight: 1.0
    checkpoint: repo://checkpoints/xiaomi_camera_null.ckpt

observer:
  phi_low: 0.025
  phi_high: 0.075
  phi_step: 0.0125
  correction_sign: -1

preparation:
  pair_output_root: dataset://projector/xiaomi_17promax/derived
  flow_checkpoint: repo://checkpoints/raft_projector_alignment.pth
  denoise_checkpoint: repo://checkpoints/dualdn_raw_denoising.pth
  flow_iterations: 40
  resize_scale: 0.5
  border_crop: 16
  blur_display_kernel: 3
  apply_gain_map_to_pairs: false
  colorchecker_corners: "1187,766;2921,757;1107,1921;2964,1935"
  colorchecker_raw_white_balance: analog_balance
